name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/robomaster-ios

jobs:
  build:
    # iOS 27 SDK requires Xcode 27. GitHub-hosted xcode-27 is Apple silicon.
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -project Controller.xcodeproj
          -scheme Controller
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Run unit tests
        run: >-
          xcodebuild
          -project Controller.xcodeproj
          -scheme Controller
          -configuration Debug
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 18 Pro'
          -derivedDataPath "$RUNNER_TEMP/DerivedDataTests"
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Controller.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Payload" \
            "$RUNNER_TEMP/Controller.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Controller-ipa
          path: ${{ runner.temp }}/Controller.ipa
          if-no-files-found: error
