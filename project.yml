name: Controller

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: 0.15.0

targets:
  Controller:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Controller
    resources:
      - path: Controller/Resources
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio-ssh
        product: NIOCore
      - package: swift-nio-ssh
        product: NIOPosix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daihachi10.controller
        INFOPLIST_FILE: Controller/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: NO

  ControllerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ControllerTests
    dependencies:
      - target: Controller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daihachi10.controller.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

